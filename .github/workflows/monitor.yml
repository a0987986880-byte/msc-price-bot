name: MSC Cruise Price Monitor (LINE)

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Playwright 與瀏覽器
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: 執行比價腳本
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python msc_price_hunter.py

      - name: 保存舉證截圖至 GitHub 附件 (保留 7 天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msc-price-screenshots
          path: 完成/
          if-no-files-found: ignore
          retention-days: 7
